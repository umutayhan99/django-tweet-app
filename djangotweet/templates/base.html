<!doctype html>
{%load static%}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweet App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{%static 'tweetapp/customform.css'%}">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'tweetapp:listtweet' %}">Tweet App</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{% url 'tweetapp:listtweet' %}">List</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tweetapp:addtweet' %}">Add Tweet</a></li>
        <!---
        <li cs="nav-item"><a class="nav-link" href="{% url 'tweetapp:addtweetbyform' %}">Add Tweet By Form</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tweetapp:addtweetbymodelform' %}">Add Tweet By Model Form</a></li>
        -->
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
        <li class="nav-item"> <form action="{%url 'logout'%}?next=/" method="post">{%csrf_token%}<button type="submit" class="nav-link btn btn-link">Logout</button></form></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tweetapp:signup' %}">Sign Up</a></li>

      </ul>
    </div> 
  </nav>

  <div class="container mt-3">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
